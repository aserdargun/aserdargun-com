name: Verify published applications

on:
  schedule:
    # Mondays 06:15 UTC: refresh the public identity, release and staleness check.
    - cron: '15 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-applications-aserdargun-com
  cancel-in-progress: false

jobs:
  verify_applications_job:
    runs-on: ubuntu-latest
    name: Verify published applications
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Install locked dependencies
        run: npm ci

      - name: Run repository validation
        run: npm test

      - name: Verify every published application
        env:
          # Repository release correlation needs read access to the application
          # repositories. Add a VERIFY_APPS_TOKEN secret to enable it; the
          # default token can only read this repository, so those checks are
          # reported as unavailable instead of failing the run.
          GH_TOKEN: ${{ secrets.VERIFY_APPS_TOKEN || github.token }}
          STALE_AFTER_DAYS: '30'
        run: npm run verify:applications -- --json verify-report.json

      - name: Upload the verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: application-verification-report
          path: verify-report.json
          if-no-files-found: warn
          retention-days: 30
